name: macos

# The macOS version (AppKit, -d __USE_COCOA__): the C code of the examples is made by fbc on Linux, the Mac builds it
# with the host mff/Cocoa/mffCocoa.m, runs it and saves its windows (MFF_SNAPSHOT) as the artifact "macos-snapshots".
# The errors of a step are shown as annotations too (their text can be read without signing in)
on:
  workflow_dispatch:
  push:
    paths:
      - 'mff/**'
      - 'examples/Hello.bas'
      - 'examples/WebAndroid/ControlsDemo.bas'
      - '.github/workflows/macos.yml'

jobs:
  c-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install FreeBASIC 1.10.1
        run: |
          set -e
          wget -q -O fb.tar.xz "https://downloads.sourceforge.net/project/fbc/FreeBASIC-1.10.1/Binaries-Linux/FreeBASIC-1.10.1-ubuntu-22.04-x86_64.tar.xz"
          tar xf fb.tar.xz
          cd FreeBASIC-1.10.1-ubuntu-22.04-x86_64 && sudo ./install.sh -i
          fbc -version

      # fbc 1.10.1 makes the C code for darwin-aarch64, the headers of the C runtime of macOS on arm64 are the ones
      # of the sources of FreeBASIC
      - name: Headers of fbc
        run: git clone --depth 1 https://github.com/freebasic/fbc.git "$RUNNER_TEMP/fbc"

      - name: C code for macOS
        run: |
          mkdir -p build
          for f in examples/Hello.bas examples/WebAndroid/ControlsDemo.bas; do
            if ! fbc -target darwin-aarch64 -gen gcc -r -d __USE_COCOA__ -i "$RUNNER_TEMP/fbc/inc" -i . "$f" > fbc.log 2>&1; then
              cat fbc.log
              grep -v "warning" fbc.log | head -n 20 | sed 's/^/::error::/'
              exit 1
            fi
            mv "${f%.bas}.c" build/
          done

      - uses: actions/upload-artifact@v4
        with:
          name: macos-c-code
          path: build
          retention-days: 3

  macos:
    needs: c-code
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: macos-c-code
          path: build

      - name: Build the runtime of FreeBASIC
        run: |
          git clone --depth 1 https://github.com/freebasic/fbc.git "$RUNNER_TEMP/fbc"
          # The cycle profiler uses a section and the __start_/__stop_ symbols of ELF: the ones of Mach-O on macOS
          perl -0pi -e 's/extern char __start_fb_profilecycledata\[\];\s*extern char __stop_fb_profilecycledata;/#if defined(__APPLE__)\nextern char __start_fb_profilecycledata[] __asm("section\$start\$__DATA\$fb_profcycle");\nextern char __stop_fb_profilecycledata __asm("section\$end\$__DATA\$fb_profcycle");\n#define FB_PROFILE_SECTION "__DATA,fb_profcycle"\n#else\nextern char __start_fb_profilecycledata[];\nextern char __stop_fb_profilecycledata;\n#define FB_PROFILE_SECTION "fb_profilecycledata"\n#endif/; s/section\("fb_profilecycledata"\)/section(FB_PROFILE_SECTION)/' "$RUNNER_TEMP/fbc/src/rtlib/profile_cycles.c"
          grep -q 'section(FB_PROFILE_SECTION)' "$RUNNER_TEMP/fbc/src/rtlib/profile_cycles.c"
          grep -q 'section\$start\$__DATA\$fb_profcycle' "$RUNNER_TEMP/fbc/src/rtlib/profile_cycles.c"
          # TARGET_ARCH: uname -m gives arm64, which the makefile of fbc takes for the 32-bit arm
          if ! make -C "$RUNNER_TEMP/fbc" rtlib -j4 TARGET_OS=darwin TARGET_ARCH=aarch64 > make.log 2>&1; then
            cat make.log
            grep -E "error:|Error [0-9]" make.log | head -n 20 | sed 's/^/::error::/'
            exit 1
          fi
          ls "$RUNNER_TEMP"/fbc/lib/freebasic/*

      - name: Build
        run: |
          for p in Hello ControlsDemo; do
            if ! sh mff/Cocoa/build.sh build/$p.c build/$p "$RUNNER_TEMP/fbc" > build.log 2>&1; then
              cat build.log
              grep -E "error|Undefined|undefined|ld:" build.log | head -n 30 | sed 's/^/::error::/'
              exit 1
            fi
          done

      # The windows are saved after 2 seconds; the button is clicked then and the windows (a message box too) are
      # saved again
      - name: Run
        run: |
          MFF_SNAPSHOT=build/Hello MFF_CLICK="Click me!" ./build/Hello > run.log 2>&1 || { cat run.log; sed 's/^/::error::/' run.log | head -n 20; exit 1; }
          MFF_SNAPSHOT=build/ControlsDemo MFF_CLICK="Ичидаги тугма" ./build/ControlsDemo > run.log 2>&1 || { cat run.log; sed 's/^/::error::/' run.log | head -n 20; exit 1; }
          ls build/*.png | sed 's/^/::notice::/'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-snapshots
          path: build/*.png
          retention-days: 3
