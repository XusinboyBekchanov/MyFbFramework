name: macos

# macOS (AppKit, -d __USE_COCOA__) and the iOS Simulator (UIKit, -d __USE_UIKIT__): the C code of the examples is made by
# fbc on Linux, the Mac builds it with the hosts mff/Cocoa/mffCocoa.m and mff/UIKit/mffUIKit.m, runs it and saves its
# windows as the artifacts "macos-snapshots" and "ios-snapshots".
# The errors of a step are shown as annotations too (their text can be read without signing in)
on:
  workflow_dispatch:
  push:
    paths:
      - 'mff/**'
      - 'examples/Hello.bas'
      - 'examples/WebAndroid/*.bas'
      - '.github/workflows/macos.yml'

jobs:
  c-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install FreeBASIC 1.10.1
        run: |
          set -e
          wget -q -O fb.tar.xz "https://downloads.sourceforge.net/project/fbc/FreeBASIC-1.10.1/Binaries-Linux/FreeBASIC-1.10.1-ubuntu-22.04-x86_64.tar.xz"
          tar xf fb.tar.xz
          cd FreeBASIC-1.10.1-ubuntu-22.04-x86_64 && sudo ./install.sh -i
          fbc -version

      # fbc 1.10.1 makes the C code for darwin-aarch64, the headers of the C runtime of macOS on arm64 are the ones
      # of the sources of FreeBASIC
      - name: Headers of fbc
        run: git clone --depth 1 https://github.com/freebasic/fbc.git "$RUNNER_TEMP/fbc"

      - name: C code for macOS and iOS
        run: |
          mkdir -p build/macos build/ios
          for f in examples/Hello.bas examples/WebAndroid/ControlsDemo.bas examples/WebAndroid/AllControlsDemo.bas examples/WebAndroid/CanvasDemo.bas; do
            for t in "macos __USE_COCOA__" "ios __USE_UIKIT__"; do
              set -- $t
              if ! fbc -target darwin-aarch64 -gen gcc -r -d "$2" -i "$RUNNER_TEMP/fbc/inc" -i . -m "$(basename "$f" .bas)" "$f" > fbc.log 2>&1; then
                cat fbc.log
                grep -v "warning" fbc.log | head -n 20 | sed 's/^/::error::/'
                exit 1
              fi
              mv "${f%.bas}.c" "build/$1/"
            done
          done

      - uses: actions/upload-artifact@v4
        with:
          name: apple-c-code
          path: build
          retention-days: 3

  macos:
    needs: c-code
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apple-c-code
          path: build

      - name: Build the runtime of FreeBASIC
        run: |
          git clone --depth 1 https://github.com/freebasic/fbc.git "$RUNNER_TEMP/fbc"
          sh mff/Apple/patch-fbc-rtlib.sh "$RUNNER_TEMP/fbc"
          # TARGET_ARCH: uname -m gives arm64, which the makefile of fbc takes for the 32-bit arm
          if ! make -C "$RUNNER_TEMP/fbc" rtlib -j4 TARGET_OS=darwin TARGET_ARCH=aarch64 > make.log 2>&1; then
            cat make.log
            grep -E "error:|Error [0-9]" make.log | head -n 20 | sed 's/^/::error::/'
            exit 1
          fi

      - name: Build
        run: |
          for p in Hello ControlsDemo AllControlsDemo CanvasDemo; do
            if ! sh mff/Cocoa/build.sh build/macos/$p.c build/macos/$p "$RUNNER_TEMP/fbc" > build.log 2>&1; then
              cat build.log
              grep -E 'error|Undefined|undefined|ld:|^ *"_' build.log | head -n 40 | sed 's/^/::error::/'
              exit 1
            fi
          done

      # The windows are saved after 2 seconds; the button is clicked then and the windows (a message box too) are saved
      # again. alarm: a program which hangs does not stop the job
      - name: Run
        run: |
          run() {
            if ! MFF_SNAPSHOT="build/macos/$1" MFF_CLICK="$2" perl -e 'alarm 60; exec @ARGV' "./build/macos/$1" > run.log 2>&1; then
              cat run.log
              echo "::error::$1 failed"
              sed 's/^/::error::/' run.log | head -n 10
              FAILED=1
            fi
          }
          FAILED=0
          run Hello "Click me!"
          run ControlsDemo "Ичидаги тугма"
          run AllControlsDemo ""
          run CanvasDemo ""
          ls build/macos/*.png | sed 's/^/::notice::/'
          exit $FAILED

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-snapshots
          path: build/macos/*.png
          retention-days: 3

  ios:
    needs: c-code
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apple-c-code
          path: build

      - name: Build the runtime of FreeBASIC for the Simulator
        run: |
          sh mff/UIKit/build-rtlib.sh "$RUNNER_TEMP/fbc-ios"

      - name: Build
        run: |
          for p in Hello ControlsDemo AllControlsDemo CanvasDemo; do
            if ! sh mff/UIKit/build.sh build/ios/$p.c build/ios/$p "$RUNNER_TEMP/fbc-ios" > build.log 2>&1; then
              cat build.log
              grep -E 'error|Undefined|undefined|ld:|^ *"_' build.log | head -n 40 | sed 's/^/::error::/'
              exit 1
            fi
          done

      - name: Run in the Simulator
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 'iPhone' | grep -oE '[0-9A-F-]{36}')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b > /dev/null
          for t in "Hello|Click me!" "ControlsDemo|Ичидаги тугма" "AllControlsDemo|" "CanvasDemo|"; do
            p="${t%%|*}"
            xcrun simctl install "$DEVICE" "build/ios/$p.app"
            SIMCTL_CHILD_MFF_CLICK="${t#*|}" xcrun simctl launch "$DEVICE" "com.myfbframework.$p" || echo "::error::$p did not start"
            sleep 1
            xcrun simctl io "$DEVICE" screenshot "build/ios/${p}_1.png"
            sleep 4
            xcrun simctl io "$DEVICE" screenshot "build/ios/${p}_2.png"
            xcrun simctl terminate "$DEVICE" "com.myfbframework.$p" || echo "::error::$p ended by itself"
          done
          ls build/ios/*.png | sed 's/^/::notice::/'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-snapshots
          path: build/ios/*.png
          retention-days: 3
